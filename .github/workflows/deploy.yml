name: Deploy to Vercel (Production)

# Auto-deploys the portal to production on every push to main.
# Uses a Vercel token (stored as a GitHub secret) so it works even though
# this repo lives under a different GitHub account than the Vercel login.
#
# IMPORTANT: we let Vercel build REMOTELY (no --prebuilt). Remote builds
# automatically inject the project's Environment Variables (VITE_SUPABASE_URL,
# VITE_SUPABASE_KEY). A local `vercel build` in CI does NOT get them baked into
# the client bundle, which produces a blank page (supabase-js throws
# "supabaseUrl is required"). Do not switch this back to --prebuilt.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production (Vercel builds remotely with project env vars)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
